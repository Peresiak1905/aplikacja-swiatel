<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenWave</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet"/>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green: #00ff88;
            --red: #ff3355;
            --yellow: #ffcc00;
            --blue: #00d4ff;
            --bg: #0a0e1a;
            --panel: #0d1526;
            --border: rgba(0,212,255,0.2);
        }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* ===== HUD GÓRNY ===== */
        #hud {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            z-index: 100;
        }
        #hud::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blue), transparent);
        }

        /* Pasek tytułowy */
        #hud-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #app-nazwa {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--blue);
            letter-spacing: 3px;
        }
        #hud-skrzyzowanie {
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: right;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Główny ekran HUD */
        #hud-glowny {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 80px;
        }

        /* Ikona światła */
        #hud-ikona {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            background: #0a0e1a;
            border: 3px solid #222;
            transition: all 0.4s ease;
        }
        #hud-ikona.czerwone {
            border-color: var(--red);
            box-shadow: 0 0 25px rgba(255,51,85,0.6), inset 0 0 20px rgba(255,51,85,0.15);
        }
        #hud-ikona.zielone {
            border-color: var(--green);
            box-shadow: 0 0 25px rgba(0,255,136,0.6), inset 0 0 20px rgba(0,255,136,0.15);
        }

        /* Duża liczba */
        #hud-liczba {
            font-family: 'Share Tech Mono', monospace;
            font-size: 72px;
            font-weight: bold;
            line-height: 1;
            transition: color 0.3s;
            flex-shrink: 0;
        }
        #hud-liczba.czerwone { color: var(--red); }
        #hud-liczba.zielone { color: var(--green); }
        #hud-liczba.brak { color: #333; }

        /* Jednostka i opis */
        #hud-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }
        #hud-jednostka {
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            color: #666;
            letter-spacing: 2px;
        }
        #hud-opis-krotki {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #hud-opis-krotki.czerwone { color: var(--red); }
        #hud-opis-krotki.zielone { color: var(--green); }

        /* Pasek postępu */
        #hud-pasek-container {
            height: 4px;
            background: #111;
            border-radius: 2px;
            overflow: hidden;
        }
        #hud-pasek {
            height: 100%;
            border-radius: 2px;
            transition: width 1s linear, background 0.3s;
        }

        /* Przyciski korekty */
        #hud-korekta {
            display: none;
            gap: 6px;
        }
        .btn-korekta-hud {
            flex: 1;
            padding: 7px;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
        }
        #bkh-czerwone { background: rgba(255,51,85,0.15); color: var(--red); border: 1px solid rgba(255,51,85,0.3); }
        #bkh-zielone { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.3); }

        /* Przyciski akcji */
        #hud-akcje {
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-hud {
            padding: 4px 10px;
            border: 1px solid var(--border);
            background: rgba(0,212,255,0.05);
            color: var(--blue);
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .btn-hud:hover, .btn-hud.aktywny { background: rgba(0,212,255,0.15); border-color: var(--blue); }
        .btn-hud.zielony { border-color: rgba(0,255,136,0.3); color: var(--green); background: rgba(0,255,136,0.05); }
        .btn-hud.zielony.aktywny { background: rgba(0,255,136,0.2); }

        /* ===== MAPA ===== */
        #mapa { flex: 1; width: 100%; }

        /* Przycisk powrotu do pojazdu */
        #btn-centruj {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 16px;
            z-index: 1000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--panel);
            border: 2px solid var(--blue);
            color: var(--blue);
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0,212,255,0.3);
            transition: all 0.2s;
        }
        #btn-centruj:hover { background: rgba(0,212,255,0.15); }

        /* ===== MODALS ===== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal.aktywny { display: flex; }
        .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 320px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .modal-box::before { content: ''; display: block; height: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); margin: -24px -24px 20px -24px; border-radius: 16px 16px 0 0; }
        .modal-box h3 { font-family: 'Share Tech Mono', monospace; color: var(--blue); font-size: 14px; letter-spacing: 3px; margin-bottom: 16px; text-transform: uppercase; }
        .modal-btn { display: block; width: 100%; margin: 6px 0; padding: 11px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 600; letter-spacing: 1px; transition: all 0.2s; }
        .modal-btn.primary { background: rgba(0,212,255,0.1); color: var(--blue); }
        .modal-btn.success { background: rgba(0,255,136,0.1); color: var(--green); }
        .modal-btn.danger { background: rgba(255,51,85,0.1); color: var(--red); }
        .modal-btn.warning { background: rgba(255,204,0,0.1); color: var(--yellow); }
        .modal-btn.neutral { background: rgba(255,255,255,0.05); color: #888; }
        .input-adres { width: 100%; padding: 10px 12px; margin: 5px 0; background: rgba(0,212,255,0.05); color: white; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-family: 'Rajdhani', sans-serif; }
        .input-adres::placeholder { color: #444; }
        .trasa-row { display: flex; align-items: center; margin-bottom: 6px; gap: 5px; }
        .btn-trasa-lista { flex: 1; padding: 10px; background: rgba(0,212,255,0.08); color: var(--blue); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; cursor: pointer; text-align: left; font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        .btn-trasa-edytuj { background: rgba(255,204,0,0.1); color: var(--yellow); border: 1px solid rgba(255,204,0,0.3); border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
        .btn-trasa-usun { background: rgba(255,51,85,0.1); color: var(--red); border: 1px solid rgba(255,51,85,0.3); border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
        #status-routing { font-size: 12px; color: var(--yellow); margin: 8px 0; min-height: 18px; font-family: 'Share Tech Mono', monospace; }
        #info-edycja { display: none; text-align: center; padding: 4px 12px; background: rgba(255,204,0,0.1); border-bottom: 1px solid rgba(255,204,0,0.3); color: var(--yellow); font-size: 11px; font-weight: 600; letter-spacing: 1px; }

        /* Panel pomiaru */
        #panel-pomiar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid var(--border); padding: 16px; z-index: 9999; text-align: center; }
        #panel-pomiar h3 { font-family: 'Share Tech Mono', monospace; color: var(--blue); font-size: 12px; letter-spacing: 2px; margin-bottom: 10px; }
        .btn-pomiar { padding: 12px 16px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin: 4px; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; }
        #bpm-czerwone { background: rgba(255,51,85,0.15); color: var(--red); border: 1px solid rgba(255,51,85,0.4); }
        #bpm-zielone { background: rgba(0,255,136,0.15); color: var(--green); border: 1px solid rgba(0,255,136,0.4); }
        #bpm-zapisz { background: rgba(0,212,255,0.15); color: var(--blue); border: 1px solid rgba(0,212,255,0.4); display: none; }
        #log-pomiarow { font-size: 11px; color: #555; margin: 6px 0; max-height: 60px; overflow-y: auto; font-family: 'Share Tech Mono', monospace; }
        #bpm-zamknij { background: rgba(255,255,255,0.05); color: #666; border: 1px solid #333; margin-top: 4px; }
    </style>
</head>
<body>

<div id="info-edycja">✏️ TRYB EDYCJI — kliknij sygnalizatory aby dodać/usunąć z trasy</div>

<div id="hud">
    <div id="hud-top">
        <div id="app-nazwa">GREENWAVE</div>
        <div id="hud-skrzyzowanie">Załaduj trasę lub kliknij sygnalizator</div>
    </div>

    <div id="hud-glowny">
        <div id="hud-ikona">⚫</div>
        <div id="hud-liczba" class="brak">--</div>
        <div id="hud-info">
            <div id="hud-jednostka"></div>
            <div id="hud-opis-krotki"></div>
        </div>
    </div>

    <div id="hud-pasek-container">
        <div id="hud-pasek" style="width:0%;background:var(--blue)"></div>
    </div>

    <div id="hud-korekta" style="display:none;gap:6px;">
        <button class="btn-korekta-hud" id="bkh-czerwone" onclick="koryguj('czerwone')">🔴 WŁAŚNIE CZERWONE</button>
        <button class="btn-korekta-hud" id="bkh-zielone" onclick="koryguj('zielone')">🟢 WŁAŚNIE ZIELONE</button>
    </div>

    <div id="hud-akcje">
        <button class="btn-hud zielony" id="btn-mowa" onclick="wlaczMowe()">🔇 GŁOS</button>
        <button class="btn-hud" onclick="przełączTrybZaznaczania()" id="btn-trasa">🗺 TRASA</button>
        <button class="btn-hud" id="btn-zapisz-trase" onclick="zapiszTrase()" style="display:none;">💾 ZAPISZ</button>
        <button class="btn-hud" onclick="otworzModalTras()">📋 MOJE</button>
        <button class="btn-hud" onclick="otworzModalRouting()">🧭 WYZNACZ</button>
        <button class="btn-hud" onclick="aktywujSymulacje()" style="border-color:rgba(255,204,0,0.3);color:var(--yellow);background:rgba(255,204,0,0.05);">⚡ SYM</button>
    </div>
</div>

<div id="mapa"></div>
<button id="btn-centruj" onclick="centrujNaPojezdzie()">📍</button>

<div class="modal" id="modal-trasy">
    <div class="modal-box">
        <h3>📋 Moje trasy</h3>
        <div id="lista-tras"></div>
        <button class="modal-btn success" onclick="nowaTrasa()">➕ Nowa trasa</button>
        <button class="modal-btn primary" onclick="eksportujTrasy()">📤 Eksportuj</button>
        <button class="modal-btn warning" onclick="importujTrasy()">📥 Importuj</button>
        <button class="modal-btn neutral" onclick="zamknijModal('modal-trasy')">Zamknij</button>
    </div>
</div>

<div class="modal" id="modal-routing">
    <div class="modal-box">
        <h3>🧭 Wyznacz trasę</h3>
        <input class="input-adres" id="adres-start" placeholder="📍 Punkt startowy"/>
        <div id="punkty-posrednie"></div>
        <button class="modal-btn primary" onclick="dodajPunktPosredni()">➕ Dodaj punkt pośredni</button>
        <input class="input-adres" id="adres-koniec" placeholder="🏁 Punkt końcowy"/>
        <div id="status-routing"></div>
        <button class="modal-btn success" onclick="wyznaczTrase()">🧭 Wyznacz i zaznacz światła</button>
        <button class="modal-btn danger" onclick="wyczyscTrase()">🗑️ Wyczyść trasę</button>
        <button class="modal-btn neutral" onclick="zamknijModal('modal-routing')">Zamknij</button>
    </div>
</div>

<div id="panel-pomiar">
    <h3 id="panel-pomiar-nazwa">POMIAR ŚWIATEŁ</h3>
    <div id="log-pomiarow"></div>
    <div>
        <button class="btn-pomiar" id="bpm-czerwone" onclick="zapiszZmiane('czerwone')">🔴 CZERWONE</button>
        <button class="btn-pomiar" id="bpm-zielone" onclick="zapiszZmiane('zielone')">🟢 ZIELONE</button>
        <button class="btn-pomiar" id="bpm-zapisz" onclick="zapiszDane()">💾 ZAPISZ DANE</button>
    </div>
    <button class="btn-pomiar" id="bpm-zamknij" onclick="zamknijPomiar()">Zamknij</button>
</div>

<script>
    // ===== MAPA 3D =====
    const mapa = new maplibregl.Map({
        container: 'mapa',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [19.9366, 50.0614],
        zoom: 16,
        pitch: 50,
        bearing: 0,
        antialias: true
    });

    mapa.on('load', () => { zaladujSygnalizatory(); });

    // Wykryj ręczne przesunięcie mapy
    let mapaPrzesunietaRecznie = false;
    mapa.on('dragstart', () => {
        mapaPrzesunietaRecznie = true;
        document.getElementById('btn-centruj').style.display = 'flex';
        document.getElementById('btn-centruj').style.alignItems = 'center';
        document.getElementById('btn-centruj').style.justifyContent = 'center';
    });

    // ===== ZMIENNE =====
    let warstwyMarkerow = {};
    let liniaTrasy = null;
    let aktualneSkrzyzowanie = null;
    let pomiary = [];
    let interwał = null;
    let mowaWlaczona = false;
    let ostatnioMowiono = null;
    let trybZaznaczania = false;
    let trybEdycji = false;
    let edytowanaNazwaTrasy = null;
    let licznikPosrednich = 0;
    let pozycjaGPS = null;
    let markerGPS = null;
    let kierunekJazdy = 0;
    let poprzedniaPozycja = null;

    // ===== DANE SKRZYŻOWAŃ =====
    function generujLosoweDane() {
        const teraz = new Date();
        const cykl = Math.floor(Math.random() * 60) + 60;
        const zielone = Math.floor(Math.random() * 30) + 15;
        const offset = Math.floor(Math.random() * cykl);
        const startSek = (teraz.getHours() * 3600 + teraz.getMinutes() * 60 + teraz.getSeconds() - offset + 86400) % 86400;
        return {
            startZielone: { h: Math.floor(startSek / 3600), m: Math.floor((startSek % 3600) / 60), s: startSek % 60 },
            czasZielone: zielone,
            czasCzerwone: cykl - zielone,
            ostatniaKorekta: null,
            ostatniKolorKorekty: null,
            symulowane: true
        };
    }

    const daneSkrzyzowan = {
        'wielicka_teligi': {
            startZielone: { h: 13, m: 50, s: 16 },
            czasZielone: 15,
            czasCzerwone: 96,
            ostatniaKorekta: null,
            ostatniKolorKorekty: null
        }
    };

    function aktywujSymulacje() {
        let liczba = 0;
        Object.keys(warstwyMarkerow).forEach(id => {
            if (!daneSkrzyzowan[id] && warstwyMarkerow[id].naTransie) {
                daneSkrzyzowan[id] = generujLosoweDane();
                liczba++;
            }
        });
        alert('✅ Symulacja — ' + liczba + ' skrzyżowań');
    }

    // ===== GPS =====
    function centrujNaPojezdzie() {
        if (!pozycjaGPS) return;
        mapaPrzesunietaRecznie = false;
        document.getElementById('btn-centruj').style.display = 'none';
        mapa.flyTo({
            center: [pozycjaGPS.lng, pozycjaGPS.lat],
            zoom: 16,
            pitch: 50,
            bearing: kierunekJazdy,
            duration: 800
        });
    }

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            // Oblicz kierunek jazdy
            if (poprzedniaPozycja) {
                const dLng = lng - poprzedniaPozycja.lng;
                const dLat = lat - poprzedniaPozycja.lat;
                const odleglosc = Math.sqrt(dLat*dLat + dLng*dLng);
                if (odleglosc > 0.00003) {
                    kierunekJazdy = Math.atan2(dLng, dLat) * 180 / Math.PI;
                }
            }
            poprzedniaPozycja = { lat, lng };
            pozycjaGPS = { lat, lng };

            // Aktualizuj marker GPS
            if (markerGPS) {
                markerGPS.setLngLat([lng, lat]);
            } else {
                const el = document.createElement('div');
                el.innerHTML = `<div style="
                    width: 0; height: 0;
                    border-left: 10px solid transparent;
                    border-right: 10px solid transparent;
                    border-bottom: 24px solid #00d4ff;
                    filter: drop-shadow(0 0 8px #00d4ff);
                "></div>`;
                el.style.cssText = 'width:20px;height:24px;';
                markerGPS = new maplibregl.Marker({ element: el, anchor: 'bottom' })
                    .setLngLat([lng, lat])
                    .addTo(mapa);
            }

            // Obróć i wycentruj mapę gdy nie jest przesunięta ręcznie
            if (!mapaPrzesunietaRecznie) {
                mapa.easeTo({
                    center: [lng, lat],
                    bearing: kierunekJazdy,
                    pitch: 50,
                    zoom: 16,
                    duration: 500
                });
            }

            aktualizujHUD();
        }, null, { enableHighAccuracy: true, maximumAge: 0 });
    }

    // ===== DYSTANS =====
    function dystans(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // ===== HUD =====
    function aktualizujHUD() {
        if (!pozycjaGPS) return;

        let najblizszyId = null;
        let minDyst = Infinity;

        Object.keys(warstwyMarkerow).forEach(id => {
            if (!warstwyMarkerow[id].naTransie) return;
            const m = warstwyMarkerow[id];
            const d = dystans(pozycjaGPS.lat, pozycjaGPS.lng, m.lat, m.lng);
            if (d < minDyst && d < 500) {
                minDyst = d;
                najblizszyId = id;
            }
        });

        if (!najblizszyId) return;

        const dane = daneSkrzyzowan[najblizszyId];
        const nazwa = warstwyMarkerow[najblizszyId].nazwa || 'Sygnalizator';

        document.getElementById('hud-skrzyzowanie').innerText = nazwa + ' · ' + Math.round(minDyst) + 'm';

        if (dane && najblizszyId !== aktualneSkrzyzowanie?.id) {
            aktywujSkrzyzowanie({ id: najblizszyId, nazwa }, dane);
        }

        // Oblicz prędkość
        if (dane) {
            const stan = obliczStan(dane);
            const predkoscMs = minDyst / stan.pozostalo;
            const predkoscKmh = Math.round(predkoscMs * 3.6);

            const ikona = document.getElementById('hud-ikona');
            const liczba = document.getElementById('hud-liczba');
            const jednostka = document.getElementById('hud-jednostka');
            const opis = document.getElementById('hud-opis-krotki');
            const pasek = document.getElementById('hud-pasek');

            if (stan.kolor === 'czerwone') {
                // STOISZ — pokaż czas do zielonego
                ikona.className = 'czerwone';
                ikona.innerText = '🔴';
                liczba.className = 'czerwone';
                liczba.innerText = stan.pozostalo;
                jednostka.innerText = 'SEK';
                opis.className = 'czerwone';
                opis.innerText = 'DO ZIELONEGO';
                const procent = (stan.pozostalo / dane.czasCzerwone) * 100;
                pasek.style.width = procent + '%';
                pasek.style.background = 'var(--red)';

                // Komunikat głosowy
                if (stan.pozostalo === 10) mow('Za 10 sekund zielone');
                if (stan.pozostalo === 5) mow('Za 5 sekund zielone');
                if (stan.pozostalo === 3) mow('Za 3 sekundy zielone');

            } else {
                // JEDZIESZ — pokaż optymalną prędkość
                ikona.className = 'zielone';
                ikona.innerText = '🟢';

                if (predkoscKmh >= 10 && predkoscKmh <= 90) {
                    liczba.className = 'zielone';
                    liczba.innerText = predkoscKmh;
                    jednostka.innerText = 'KM/H';
                    opis.className = 'zielone';
                    opis.innerText = 'ABY ZŁAPAĆ ZIELONE';
                } else if (predkoscKmh < 10) {
                    liczba.className = 'zielone';
                    liczba.innerText = '✓';
                    jednostka.innerText = '';
                    opis.className = 'zielone';
                    opis.innerText = 'JEDŹ NORMALNIE';
                } else {
                    liczba.className = 'czerwone';
                    liczba.innerText = '✗';
                    jednostka.innerText = '';
                    opis.className = 'czerwone';
                    opis.innerText = 'NIE ZDĄŻYSZ — ZWOLNIJ';
                }

                const procent = (stan.pozostalo / dane.czasZielone) * 100;
                pasek.style.width = procent + '%';
                pasek.style.background = 'var(--green)';

                if (stan.pozostalo === 3) mow('Uwaga, za 3 sekundy czerwone');
            }
        }
    }

    function aktywujSkrzyzowanie(skrzyzowanie, dane) {
        aktualneSkrzyzowanie = skrzyzowanie;
        document.getElementById('hud-korekta').style.display = 'flex';
        if (interwał) clearInterval(interwał);
        interwał = setInterval(aktualizujHUD, 1000);
        setInterval(aktualizujHUD, 3000);
    }

    // ===== OBLICZ STAN =====
    function obliczStan(dane) {
        const teraz = Date.now();
        const cykl = (dane.czasZielone + dane.czasCzerwone) * 1000;
        if (dane.ostatniaKorekta !== null) {
            const uplynelo = teraz - dane.ostatniaKorekta;
            let pozycja = dane.ostatniKolorKorekty === 'zielone' ? uplynelo % cykl : (dane.czasZielone * 1000 + uplynelo) % cykl;
            const sek = Math.floor(pozycja / 1000);
            if (sek < dane.czasZielone) return { kolor: 'zielone', pozostalo: dane.czasZielone - sek };
            return { kolor: 'czerwone', pozostalo: dane.czasZielone + dane.czasCzerwone - sek };
        }
        const start = new Date();
        start.setHours(dane.startZielone.h, dane.startZielone.m, dane.startZielone.s, 0);
        if (start > new Date()) start.setDate(start.getDate() - 1);
        const sek = Math.floor((Date.now() - start.getTime()) / 1000);
        const poz = sek % (dane.czasZielone + dane.czasCzerwone);
        if (poz < dane.czasZielone) return { kolor: 'zielone', pozostalo: dane.czasZielone - poz };
        return { kolor: 'czerwone', pozostalo: dane.czasZielone + dane.czasCzerwone - poz };
    }

    // ===== KOREKTA =====
    function koryguj(kolor) {
        const dane = daneSkrzyzowan[aktualneSkrzyzowanie?.id];
        if (!dane) return;
        dane.ostatniaKorekta = Date.now();
        dane.ostatniKolorKorekty = kolor;
        ostatnioMowiono = null;
        mow(kolor === 'zielone' ? 'Zsynchronizowano. Zielone.' : 'Zsynchronizowano. Czerwone.');
    }

    // ===== MOWA =====
    function wlaczMowe() {
        mowaWlaczona = !mowaWlaczona;
        const btn = document.getElementById('btn-mowa');
        if (mowaWlaczona) {
            btn.innerText = '🔊 GŁOS';
            btn.classList.add('aktywny');
            mow('Głos włączony');
        } else {
            btn.innerText = '🔇 GŁOS';
            btn.classList.remove('aktywny');
            ostatnioMowiono = null;
        }
    }

    function mow(tekst) {
        if (!mowaWlaczona || ostatnioMowiono === tekst) return;
        ostatnioMowiono = tekst;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(tekst);
        msg.lang = 'pl-PL';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    // ===== MARKERY =====
    function zaladujSygnalizatory() {
        dodajMarker(50.03667663430466, 19.94068768665933, 'mateczny_kalwaryjska', 'Mateczny / Kalwaryjska');
        dodajMarker(50.017316906572326, 19.991255815131844, 'wielicka_facimiech', 'Wielicka / Facimiech');
        dodajMarker(50.01420215172329, 19.999269960360717, 'wielicka_teligi', 'Wielicka / Teligi');

        fetch('sygnalizatory.geojson')
            .then(r => r.json())
            .then(data => {
                data.features.forEach(f => {
                    const id = 'osm_' + f.id;
                    const nazwa = f.properties.name || 'Sygnalizator';
                    const [lng, lat] = f.geometry.coordinates;
                    dodajMarkerOSM(lat, lng, id, nazwa);
                });
            });
    }

    function stworzEl(kolor, rozmiar) {
        const el = document.createElement('div');
        el.style.cssText = `width:${rozmiar}px;height:${rozmiar}px;background:${kolor};border:2px solid white;border-radius:50%;cursor:pointer;box-shadow:0 0 8px ${kolor};transition:all 0.3s;`;
        return el;
    }

    function dodajMarker(lat, lng, id, nazwa) {
        const el = stworzEl('#ff3355', 16);
        const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(mapa);
        el.addEventListener('click', () => {
            if (trybZaznaczania) {
                warstwyMarkerow[id].naTransie = !warstwyMarkerow[id].naTransie;
                const k = warstwyMarkerow[id].naTransie ? '#00ff88' : '#ff3355';
                el.style.background = k; el.style.boxShadow = `0 0 8px ${k}`;
            } else {
                const dane = daneSkrzyzowan[id];
                if (dane) aktywujSkrzyzowanie({ id, nazwa }, dane);
                else otworzPomiar({ id, nazwa });
            }
        });
        warstwyMarkerow[id] = { marker, el, naTransie: false, nazwa, lat, lng, reczny: true };
    }

    function dodajMarkerOSM(lat, lng, id, nazwa) {
        const el = stworzEl('#ffcc00', 10);
        const marker = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(mapa);
        el.addEventListener('click', () => {
            if (trybZaznaczania) {
                warstwyMarkerow[id].naTransie = !warstwyMarkerow[id].naTransie;
                const k = warstwyMarkerow[id].naTransie ? '#00ff88' : '#ffcc00';
                el.style.background = k; el.style.boxShadow = `0 0 8px ${k}`;
            } else {
                const dane = daneSkrzyzowan[id];
                if (dane) aktywujSkrzyzowanie({ id, nazwa }, dane);
                else otworzPomiar({ id, nazwa });
            }
        });
        warstwyMarkerow[id] = { marker, el, naTransie: false, nazwa, lat, lng, reczny: false };
    }

    // ===== POMIAR =====
    function otworzPomiar(skrzyzowanie) {
        aktualneSkrzyzowanie = skrzyzowanie;
        pomiary = [];
        document.getElementById('panel-pomiar').style.display = 'block';
        document.getElementById('panel-pomiar-nazwa').innerText = skrzyzowanie.nazwa.toUpperCase();
        document.getElementById('log-pomiarow').innerHTML = '';
        document.getElementById('bpm-zapisz').style.display = 'none';
        document.getElementById('hud-skrzyzowanie').innerText = skrzyzowanie.nazwa;
    }

    function zamknijPomiar() {
        document.getElementById('panel-pomiar').style.display = 'none';
        pomiary = [];
    }

    function zapiszZmiane(kolor) {
        const teraz = Date.now();
        pomiary.push({ kolor, czas: teraz });
        const godzinaStr = new Date(teraz).toLocaleTimeString('pl-PL');
        document.getElementById('log-pomiarow').innerHTML += (kolor === 'czerwone' ? '🔴' : '🟢') + ' ' + godzinaStr + '<br>';
        if (pomiary.length >= 2) {
            document.getElementById('bpm-zapisz').style.display = 'inline-block';
        }
    }

    function zapiszDane() {
        if (pomiary.length < 2) return;
        let sumaZ = 0, liczbZ = 0, sumaC = 0, liczbC = 0;
        for (let i = 1; i < pomiary.length; i++) {
            const r = (pomiary[i].czas - pomiary[i-1].czas) / 1000;
            if (pomiary[i].kolor === 'zielone') { sumaC += r; liczbC++; }
            else { sumaZ += r; liczbZ++; }
        }
        const pierwszeZ = pomiary.find(p => p.kolor === 'zielone');
        const d = new Date(pierwszeZ.czas);
        daneSkrzyzowan[aktualneSkrzyzowanie.id] = {
            startZielone: { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() },
            czasZielone: liczbZ > 0 ? Math.round(sumaZ / liczbZ) : 15,
            czasCzerwone: liczbC > 0 ? Math.round(sumaC / liczbC) : 90,
            ostatniaKorekta: null,
            ostatniKolorKorekty: null
        };
        alert('✅ Zapisano!');
        zamknijPomiar();
        aktywujSkrzyzowanie(aktualneSkrzyzowanie, daneSkrzyzowan[aktualneSkrzyzowanie.id]);
    }

    // ===== TRASY =====
    function wczytajTrasy() { return JSON.parse(localStorage.getItem('trasy') || '{}'); }
    function zapiszTrasy(trasy) { localStorage.setItem('trasy', JSON.stringify(trasy)); }

    function eksportujTrasy() {
        const trasy = wczytajTrasy();
        if (!Object.keys(trasy).length) { alert('Brak tras!'); return; }
        prompt('Skopiuj kod:', btoa(JSON.stringify(trasy)));
    }

    function importujTrasy() {
        const kod = prompt('Wklej kod:');
        if (!kod) return;
        try {
            const trasy = JSON.parse(atob(kod));
            zapiszTrasy(Object.assign(wczytajTrasy(), trasy));
            alert('✅ Zaimportowano!');
            otworzModalTras();
        } catch(e) { alert('❌ Błędny kod'); }
    }

    function zapiszTrase() {
        const punkty = Object.keys(warstwyMarkerow).filter(id => warstwyMarkerow[id].naTransie);
        if (!punkty.length) { alert('Nie zaznaczono sygnalizatorów!'); return; }
        const nazwa = trybEdycji ? edytowanaNazwaTrasy : prompt('Nazwa trasy:', 'Trasa ' + (Object.keys(wczytajTrasy()).length + 1));
        if (!nazwa) return;
        const trasy = wczytajTrasy();
        trasy[nazwa] = punkty;
        zapiszTrasy(trasy);
        alert('✅ Zapisano "' + nazwa + '"');
        wyjdzZTrybu();
    }

    function wyjdzZTrybu() {
        trybZaznaczania = false;
        trybEdycji = false;
        edytowanaNazwaTrasy = null;
        document.getElementById('btn-zapisz-trase').style.display = 'none';
        document.getElementById('btn-trasa').innerText = '🗺 TRASA';
        document.getElementById('btn-trasa').classList.remove('aktywny');
        document.getElementById('info-edycja').style.display = 'none';
    }

    function otworzModalTras() {
        const trasy = wczytajTrasy();
        const lista = document.getElementById('lista-tras');
        lista.innerHTML = '';
        if (!Object.keys(trasy).length) {
            lista.innerHTML = '<p style="color:#444;font-size:12px;margin:10px 0">Brak tras</p>';
        } else {
            Object.keys(trasy).forEach(nazwa => {
                const row = document.createElement('div');
                row.className = 'trasa-row';
                const btn = document.createElement('button');
                btn.className = 'btn-trasa-lista';
                btn.innerText = '🗺 ' + nazwa + ' (' + trasy[nazwa].length + ')';
                btn.onclick = () => { zaladujTrase(nazwa); zamknijModal('modal-trasy'); };
                const be = document.createElement('button');
                be.className = 'btn-trasa-edytuj';
                be.innerText = '✏️';
                be.onclick = () => { edytujTrase(nazwa); zamknijModal('modal-trasy'); };
                const bu = document.createElement('button');
                bu.className = 'btn-trasa-usun';
                bu.innerText = '🗑';
                bu.onclick = () => {
                    if (confirm('Usunąć "' + nazwa + '"?')) {
                        const t = wczytajTrasy(); delete t[nazwa]; zapiszTrasy(t); otworzModalTras();
                    }
                };
                row.appendChild(btn); row.appendChild(be); row.appendChild(bu);
                lista.appendChild(row);
            });
        }
        document.getElementById('modal-trasy').classList.add('aktywny');
    }

    function zamknijModal(id) { document.getElementById(id).classList.remove('aktywny'); }

    function nowaTrasa() {
        zamknijModal('modal-trasy');
        Object.keys(warstwyMarkerow).forEach(id => {
            warstwyMarkerow[id].naTransie = false;
            const k = warstwyMarkerow[id].reczny ? '#ff3355' : '#ffcc00';
            warstwyMarkerow[id].el.style.background = k;
            warstwyMarkerow[id].el.style.boxShadow = `0 0 8px ${k}`;
        });
        trybZaznaczania = true;
        document.getElementById('btn-trasa').innerText = '✅ ZAZNACZ';
        document.getElementById('btn-trasa').classList.add('aktywny');
        document.getElementById('btn-zapisz-trase').style.display = 'inline-block';
    }

    function edytujTrase(nazwa) {
        zaladujTrase(nazwa);
        trybZaznaczania = true;
        trybEdycji = true;
        edytowanaNazwaTrasy = nazwa;
        document.getElementById('btn-trasa').innerText = '✏️ EDYCJA';
        document.getElementById('btn-trasa').classList.add('aktywny');
        document.getElementById('btn-zapisz-trase').style.display = 'inline-block';
        document.getElementById('info-edycja').style.display = 'block';
    }

    function zaladujTrase(nazwa) {
        const punkty = wczytajTrasy()[nazwa] || [];
        Object.keys(warstwyMarkerow).forEach(id => {
            warstwyMarkerow[id].naTransie = false;
            const k = warstwyMarkerow[id].reczny ? '#ff3355' : '#ffcc00';
            warstwyMarkerow[id].el.style.background = k;
            warstwyMarkerow[id].el.style.boxShadow = `0 0 8px ${k}`;
        });
        punkty.forEach(id => {
            if (warstwyMarkerow[id]) {
                warstwyMarkerow[id].naTransie = true;
                warstwyMarkerow[id].el.style.background = '#00ff88';
                warstwyMarkerow[id].el.style.boxShadow = '0 0 8px #00ff88';
            }
        });
    }

    function przełączTrybZaznaczania() {
        if (trybZaznaczania) {
            wyjdzZTrybu();
            Object.keys(warstwyMarkerow).forEach(id => {
                warstwyMarkerow[id].naTransie = false;
                const k = warstwyMarkerow[id].reczny ? '#ff3355' : '#ffcc00';
                warstwyMarkerow[id].el.style.background = k;
                warstwyMarkerow[id].el.style.boxShadow = `0 0 8px ${k}`;
            });
        } else {
            nowaTrasa();
        }
    }

    // ===== ROUTING =====
    function otworzModalRouting() { document.getElementById('modal-routing').classList.add('aktywny'); }

    function dodajPunktPosredni() {
        licznikPosrednich++;
        const div = document.createElement('div');
        div.id = 'pos-' + licznikPosrednich;
        div.style.cssText = 'display:flex;gap:5px;margin:5px 0';
        div.innerHTML = `<input class="input-adres" style="flex:1" placeholder="📌 Punkt pośredni ${licznikPosrednich}" id="adres-pos-${licznikPosrednich}"/>
        <button onclick="document.getElementById('pos-${licznikPosrednich}').remove()" style="padding:5px 10px;background:rgba(255,51,85,0.2);color:var(--red);border:1px solid rgba(255,51,85,0.3);border-radius:8px;cursor:pointer;">✕</button>`;
        document.getElementById('punkty-posrednie').appendChild(div);
    }

    async function geokoduj(adres) {
        const q = adres.toLowerCase().includes('kraków') || adres.toLowerCase().includes('krakow') ? adres : adres + ', Kraków';
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1&countrycodes=pl&viewbox=19.7,50.2,20.2,49.9&bounded=1`;
        const resp = await fetch(url, { headers: { 'Accept-Language': 'pl' } });
        const dane = await resp.json();
        if (!dane.length) throw new Error('Nie znaleziono: ' + adres);
        return { lat: parseFloat(dane[0].lat), lng: parseFloat(dane[0].lon) };
    }

    function dystansDoLinii(pLat, pLng, aLat, aLng, bLat, bLng) {
        const dx = bLng - aLng, dy = bLat - aLat;
        if (!dx && !dy) return dystans(pLat, pLng, aLat, aLng);
        const t = Math.max(0, Math.min(1, ((pLng-aLng)*dx + (pLat-aLat)*dy) / (dx*dx+dy*dy)));
        return dystans(pLat, pLng, aLat+t*dy, aLng+t*dx);
    }

    function czyNaTransie(lat, lng, wsp, promien) {
        for (let i = 0; i < wsp.length-1; i++) {
            if (dystansDoLinii(lat, lng, wsp[i][0], wsp[i][1], wsp[i+1][0], wsp[i+1][1]) <= promien) return true;
        }
        return false;
    }

    async function wyznaczTrase() {
        const status = document.getElementById('status-routing');
        status.innerText = '⏳ Szukam adresów...';
        try {
            const start = await geokoduj(document.getElementById('adres-start').value);
            const koniec = await geokoduj(document.getElementById('adres-koniec').value);
            const posrednie = [];
            for (let i = 1; i <= licznikPosrednich; i++) {
                const el = document.getElementById('adres-pos-' + i);
                if (el?.value) posrednie.push(await geokoduj(el.value));
            }
            status.innerText = '⏳ Wyznaczam trasę...';
            let url = `${start.lng},${start.lat}`;
            posrednie.forEach(p => url += `;${p.lng},${p.lat}`);
            url += `;${koniec.lng},${koniec.lat}`;
            const resp = await fetch(`https://router.project-osrm.org/route/v1/driving/${url}?overview=full&geometries=geojson`);
            const dane = await resp.json();
            if (dane.code !== 'Ok') { status.innerText = '❌ Błąd trasy'; return; }

            if (liniaTrasy) { try { mapa.removeLayer('trasa'); mapa.removeSource('trasa'); } catch(e) {} liniaTrasy = null; }

            const wsp = dane.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            mapa.addSource('trasa', { type: 'geojson', data: { type: 'Feature', geometry: dane.routes[0].geometry } });
            mapa.addLayer({ id: 'trasa', type: 'line', source: 'trasa', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': '#8e44ad', 'line-width': 6, 'line-opacity': 0.8 } });
            liniaTrasy = true;

            const coords = dane.routes[0].geometry.coordinates;
            const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
            mapa.fitBounds(bounds, { padding: 60 });

            let liczba = 0;
            Object.keys(warstwyMarkerow).forEach(id => {
                const m = warstwyMarkerow[id];
                const naT = czyNaTransie(m.lat, m.lng, wsp, 20);
                m.naTransie = naT;
                const k = naT ? '#00ff88' : (m.reczny ? '#ff3355' : '#ffcc00');
                m.el.style.background = k;
                m.el.style.boxShadow = `0 0 8px ${k}`;
                if (naT) liczba++;
            });

            const min = Math.round(dane.routes[0].duration/60);
            const km = (dane.routes[0].distance/1000).toFixed(1);
            status.innerText = `✅ ${km}km · ${min}min · ${liczba} świateł`;
        } catch(e) { status.innerText = '❌ ' + e.message; }
    }

    function wyczyscTrase() {
        if (liniaTrasy) { try { mapa.removeLayer('trasa'); mapa.removeSource('trasa'); } catch(e) {} liniaTrasy = null; }
        Object.keys(warstwyMarkerow).forEach(id => {
            warstwyMarkerow[id].naTransie = false;
            const k = warstwyMarkerow[id].reczny ? '#ff3355' : '#ffcc00';
            warstwyMarkerow[id].el.style.background = k;
            warstwyMarkerow[id].el.style.boxShadow = `0 0 8px ${k}`;
        });
        document.getElementById('status-routing').innerText = '';
        document.getElementById('adres-start').value = '';
        document.getElementById('adres-koniec').value = '';
        document.getElementById('punkty-posrednie').innerHTML = '';
        licznikPosrednich = 0;
    }
</script>
