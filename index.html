<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Świateł Kraków</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-top: 20px;
            font-size: 22px;
            color: #00d4ff;
        }
        #mapa {
            width: 100%;
            height: 80vh;
        }
        #panel {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #16213e;
            border-top: 2px solid #00d4ff;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            z-index: 9999;
        }
        #panel h2 {
            margin: 0 0 10px 0;
            color: #00d4ff;
            font-size: 18px;
        }
        #swiatlo { font-size: 48px; margin: 10px 0; }
        #odliczanie { font-size: 36px; font-weight: bold; margin: 5px 0; }
        #opis { font-size: 16px; color: #aaa; margin: 5px 0; }
        #przyciski-pomiaru {
            margin: 10px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-pomiar {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        #btn-czerwone {
            background: #e74c3c;
            color: white;
        }
        #btn-zielone {
            background: #2ecc71;
            color: white;
        }
        #btn-zapisz {
            background: #00d4ff;
            color: #1a1a2e;
            display: none;
        }
        #log-pomiarow {
            font-size: 13px;
            color: #aaa;
            margin: 8px 0;
            min-height: 20px;
        }
        #dane-skrzyzowania {
            font-size: 13px;
            color: #ffcc00;
            margin: 5px 0;
        }
        #zamknij {
            margin-top: 10px;
            padding: 8px 20px;
            background: #444;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>Aplikacja Świateł Kraków</h1>
    <div id="mapa"></div>

    <div id="panel">
        <h2 id="nazwa-skrzyzowania">Skrzyżowanie</h2>
        <div id="swiatlo">⚫</div>
        <div id="odliczanie">--</div>
        <div id="opis">Kliknij przycisk gdy zmienia się światło</div>
        <div id="dane-skrzyzowania"></div>
        <div id="log-pomiarow"></div>
        <div id="przyciski-pomiaru">
            <button class="btn-pomiar" id="btn-czerwone" onclick="zapiszZmiane('czerwone')">🔴 Zapaliło się CZERWONE</button>
            <button class="btn-pomiar" id="btn-zielone" onclick="zapiszZmiane('zielone')">🟢 Zapaliło się ZIELONE</button>
            <button class="btn-pomiar" id="btn-zapisz" onclick="zapiszDane()">💾 Zapisz dane</button>
        </div>
        <button id="zamknij" onclick="zamknijPanel()">Zamknij</button>
    </div>

    <script>
        const mapa = L.map('mapa').setView([50.01420215172329, 19.999269960360717], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(mapa);

        let aktualneSkrzyzowanie = null;
        let pomiary = [];
        let interwał = null;

        // Wczytaj zapisane dane z localStorage
        function wczytajDane(id) {
            const dane = localStorage.getItem('swiatla_' + id);
            return dane ? JSON.parse(dane) : null;
        }

        // Zapisz dane do localStorage
        function zapiszDane() {
            if (pomiary.length < 2) {
                alert("Potrzebujesz co najmniej 2 pomiarów żeby zapisać dane.");
                return;
            }

            // Oblicz średnie czasy z pomiarów
            let sumaZielone = 0, sumaZielonaLiczba = 0;
            let sumaCzerwone = 0, sumaCzerwonaLiczba = 0;

            for (let i = 1; i < pomiary.length; i++) {
                const roznica = (pomiary[i].czas - pomiary[i-1].czas) / 1000;
                if (pomiary[i].kolor === 'zielone') {
                    sumaCzerwone += roznica;
                    sumaCzerwonaLiczba++;
                } else {
                    sumaZielone += roznica;
                    sumaZielonaLiczba++;
                }
            }

            const dane = {
                id: aktualneSkrzyzowanie.id,
                nazwa: aktualneSkrzyzowanie.nazwa,
                startZielone: pomiary.find(p => p.kolor === 'zielone') 
                    ? formatujCzas(new Date(pomiary.find(p => p.kolor === 'zielone').czas))
                    : null,
                czasZielone: sumaZielonaLiczba > 0 ? Math.round(sumaZielone / sumaZielonaLiczba) : null,
                czasCzerwone: sumaCzerwonaLiczba > 0 ? Math.round(sumaCzerwone / sumaCzerwonaLiczba) : null
            };

            localStorage.setItem('swiatla_' + aktualneSkrzyzowanie.id, JSON.stringify(dane));
            alert("✅ Dane zapisane!\nZielone: " + dane.czasZielone + "s\nCzerwone: " + dane.czasCzerwone + "s");
            pokazDaneSkrzyzowania(dane);
        }

        function formatujCzas(date) {
            return {
                h: date.getHours(),
                m: date.getMinutes(),
                s: date.getSeconds()
            };
        }

        function zapiszZmiane(kolor) {
            const teraz = Date.now();
            pomiary.push({ kolor, czas: teraz });

            const godzinaStr = new Date(teraz).toLocaleTimeString('pl-PL');
            const log = document.getElementById('log-pomiarow');
            const ikona = kolor === 'czerwone' ? '🔴' : '🟢';
            log.innerHTML += ikona + ' ' + godzinaStr + '<br>';

            // Pokaż przycisk zapisz po 2 pomiarach
            if (pomiary.length >= 2) {
                document.getElementById('btn-zapisz').style.display = 'inline-block';
            }

            // Aktualizuj emoji światła
            document.getElementById('swiatlo').innerText = kolor === 'czerwone' ? '🔴' : '🟢';

            // Oblicz czas ostatniego odcinka
            if (pomiary.length >= 2) {
                const ostatni = pomiary[pomiary.length - 1];
                const przedostatni = pomiary[pomiary.length - 2];
                const sekundy = Math.round((ostatni.czas - przedostatni.czas) / 1000);
                const poprzedniKolor = przedostatni.kolor;
                document.getElementById('odliczanie').innerText = poprzedniKolor + ' trwało: ' + sekundy + 's';
            }
        }

        function pokazDaneSkrzyzowania(dane) {
            const el = document.getElementById('dane-skrzyzowania');
            if (dane && dane.czasZielone && dane.czasCzerwone) {
                el.innerText = '📊 Zapisane: Zielone ' + dane.czasZielone + 's | Czerwone ' + dane.czasCzerwone + 's';
            } else {
                el.innerText = '📊 Brak zapisanych danych — zmierz światła na miejscu';
            }
        }

        function otworzPanel(skrzyzowanie) {
            aktualneSkrzyzowanie = skrzyzowanie;
            pomiary = [];
            document.getElementById('panel').style.display = 'block';
            document.getElementById('nazwa-skrzyzowania').innerText = skrzyzowanie.nazwa;
            document.getElementById('swiatlo').innerText = '⚫';
            document.getElementById('odliczanie').innerText = '--';
            document.getElementById('opis').innerText = 'Kliknij przycisk gdy zmienia się światło';
            document.getElementById('log-pomiarow').innerHTML = '';
            document.getElementById('btn-zapisz').style.display = 'none';

            const dane = wczytajDane(skrzyzowanie.id);
            pokazDaneSkrzyzowania(dane);
        }

        function zamknijPanel() {
            document.getElementById('panel').style.display = 'none';
            pomiary = [];
            if (interwał) clearInterval(interwał);
        }

        // Sygnalizator Wielicka/Teligi
        const markerWielicka = L.circleMarker([50.01420215172329, 19.999269960360717], {
            radius: 8,
            fillColor: "#ff0000",
            color: "#fff",
            weight: 2,
            fillOpacity: 1
        }).addTo(mapa);

        markerWielicka.on('click', function() {
            otworzPanel({
                id: 'wielicka_teligi',
                nazwa: 'Wielicka / Teligi',
                lat: 50.01420215172329,
                lng: 19.999269960360717
            });
        });

        // Wczytaj pozostałe sygnalizatory z GeoJSON
        fetch('sygnalizatory.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 5,
                            fillColor: "#ffcc00",
                            color: "#fff",
                            weight: 1,
                            fillOpacity: 0.8
                        });
                    },
                    onEachFeature: function(feature, layer) {
                        const id = 'osm_' + feature.id;
                        const nazwa = feature.properties.name || 'Sygnalizator';
                        layer.on('click', function() {
                            otworzPanel({ id, nazwa, lat: feature.geometry.coordinates[1], lng: feature.geometry.coordinates[0] });
                        });
                    }
                }).addTo(mapa);
            });
    </script>
</body>
</html>
