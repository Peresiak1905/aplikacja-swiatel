<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikacja Świateł Kraków</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #1a1a2e; color: white; }
        h1 { text-align: center; margin: 5px 0; font-size: 16px; color: #00d4ff; }
        #gorny-pasek { text-align: center; margin: 3px 0; display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; padding: 3px; background: #16213e; }
        .btn-top { padding: 5px 12px; border: none; border-radius: 15px; font-size: 12px; cursor: pointer; }
        #btn-trasa { background: #444; color: white; }
        #btn-zapisz-trase { background: #27ae60; color: white; display: none; }
        #btn-wybierz-trase { background: #2980b9; color: white; }
        #btn-wyznacz { background: #8e44ad; color: white; }
        #mapa { width: 100%; height: calc(100vh - 80px); }
        #panel {
            display: none; position: fixed; bottom: 0; left: 0;
            width: 100%; background: #16213e;
            border-top: 2px solid #00d4ff;
            padding: 15px; box-sizing: border-box;
            text-align: center; z-index: 9999;
        }
        #panel h2 { margin: 0 0 5px 0; color: #00d4ff; font-size: 16px; }
        #swiatlo { font-size: 60px; margin: 5px 0; }
        #odliczanie { font-size: 42px; font-weight: bold; margin: 3px 0; }
        #opis { font-size: 14px; color: #aaa; margin: 3px 0; }
        #dokladnosc { font-size: 12px; color: #ffcc00; margin: 3px 0; }
        #przyciski-korekty { display: flex; gap: 8px; justify-content: center; margin: 8px 0; flex-wrap: wrap; }
        .btn-korekta { padding: 10px 15px; border: none; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        #btn-korekta-czerwone { background: #e74c3c; color: white; }
        #btn-korekta-zielone { background: #2ecc71; color: white; }
        #btn-mowa { padding: 8px 15px; background: #9b59b6; color: white; border: none; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: bold; margin: 5px; }
        #przyciski-pomiaru { display: none; margin: 8px 0; }
        .btn-pomiar { padding: 10px 15px; border: none; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; margin: 3px; }
        #btn-czerwone { background: #e74c3c; color: white; }
        #btn-zielone { background: #2ecc71; color: white; }
        #btn-zapisz { background: #00d4ff; color: #1a1a2e; display: none; }
        #log-pomiarow { font-size: 12px; color: #aaa; margin: 5px 0; max-height: 80px; overflow-y: auto; }
        #tryb-toggle { font-size: 12px; color: #00d4ff; cursor: pointer; text-decoration: underline; margin: 5px 0; display: inline-block; }
        #zamknij { margin-top: 5px; padding: 6px 15px; background: #444; color: white; border: none; border-radius: 20px; font-size: 13px; cursor: pointer; }
        #modal-trasy {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 99999;
            justify-content: center; align-items: center;
        }
        #modal-trasy.aktywny { display: flex; }
        #modal-zawartosc {
            background: #16213e; border: 2px solid #00d4ff;
            border-radius: 15px; padding: 20px;
            width: 320px; text-align: center;
            max-height: 80vh; overflow-y: auto;
        }
        #modal-zawartosc h3 { color: #00d4ff; margin: 0 0 15px 0; }
        .trasa-row { display: flex; align-items: center; margin-bottom: 8px; gap: 5px; }
        .btn-trasa-lista { flex: 1; padding: 10px; background: #2980b9; color: white; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; text-align: left; }
        .btn-trasa-edytuj { background: #f39c12; color: white; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
        .btn-trasa-usun { background: #e74c3c; color: white; border: none; border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
        #btn-nowa-trasa { display: block; width: 100%; margin: 10px 0 5px 0; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        #btn-zamknij-modal { display: block; width: 100%; margin: 5px 0; padding: 8px; background: #444; color: white; border: none; border-radius: 10px; font-size: 13px; cursor: pointer; }
        #info-edycja { display: none; text-align: center; padding: 5px; background: #f39c12; color: #1a1a2e; font-size: 12px; font-weight: bold; }
        #modal-routing {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 99999;
            justify-content: center; align-items: center;
        }
        #modal-routing.aktywny { display: flex; }
        #modal-routing-zawartosc {
            background: #16213e; border: 2px solid #8e44ad;
            border-radius: 15px; padding: 20px;
            width: 320px; text-align: center;
            max-height: 90vh; overflow-y: auto;
        }
        #modal-routing-zawartosc h3 { color: #8e44ad; margin: 0 0 15px 0; }
        .input-adres {
            width: 100%; padding: 10px; margin: 5px 0;
            background: #0f3460; color: white;
            border: 1px solid #00d4ff; border-radius: 10px;
            font-size: 14px; box-sizing: border-box;
        }
        .input-adres::placeholder { color: #aaa; }
        #punkty-posrednie { margin: 5px 0; }
        .btn-routing { display: block; width: 100%; margin: 5px 0; padding: 10px; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
        #btn-dodaj-posredni { background: #2980b9; color: white; }
        #btn-wyznacz-trase { background: #8e44ad; color: white; font-weight: bold; }
        #btn-wyczysc-trase { background: #e74c3c; color: white; }
        #btn-zamknij-routing { background: #444; color: white; }
        #status-routing { font-size: 12px; color: #ffcc00; margin: 5px 0; min-height: 20px; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>Aplikacja Świateł Kraków</h1>
    <div id="info-edycja">✏️ Tryb edycji trasy — kliknij sygnalizatory aby dodać/usunąć. Kliknij "Zapisz zmiany" gdy skończysz.</div>
    <div id="gorny-pasek">
        <button class="btn-top" id="btn-trasa" onclick="przełączTrybZaznaczania()">🗺️ Zaznacz trasę</button>
        <button class="btn-top" id="btn-zapisz-trase" onclick="zapiszTrase()">💾 Zapisz trasę</button>
        <button class="btn-top" id="btn-wybierz-trase" onclick="otworzModalTras()">📋 Moje trasy</button>
        <button class="btn-top" id="btn-wyznacz" onclick="otworzModalRouting()">🧭 Wyznacz trasę</button>
    </div>
    <div id="mapa"></div>

    <!-- Modal tras -->
    <div id="modal-trasy">
        <div id="modal-zawartosc">
            <h3>📋 Moje trasy</h3>
            <div id="lista-tras"></div>
            <button id="btn-nowa-trasa" onclick="nowaTrasa()">➕ Nowa trasa</button>
            <button onclick="eksportujTrasy()" style="display:block;width:100%;margin:5px 0;padding:10px;background:#8e44ad;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;">📤 Eksportuj trasy</button>
            <button onclick="importujTrasy()" style="display:block;width:100%;margin:5px 0;padding:10px;background:#d35400;color:white;border:none;border-radius:10px;font-size:14px;cursor:pointer;">📥 Importuj trasy</button>
            <button id="btn-zamknij-modal" onclick="zamknijModal()">Zamknij</button>
        </div>
    </div>

    <!-- Modal routing -->
    <div id="modal-routing">
        <div id="modal-routing-zawartosc">
            <h3>🧭 Wyznacz trasę</h3>
            <input class="input-adres" id="adres-start" placeholder="📍 Punkt startowy (np. Wielicka 1, Kraków)"/>
            <div id="punkty-posrednie"></div>
            <button class="btn-routing" id="btn-dodaj-posredni" onclick="dodajPunktPosredni()">➕ Dodaj punkt pośredni</button>
            <input class="input-adres" id="adres-koniec" placeholder="🏁 Punkt końcowy (np. Reymonta 22, Kraków)"/>
            <div id="status-routing"></div>
            <button class="btn-routing" id="btn-wyznacz-trase" onclick="wyznaczTrase()">🧭 Wyznacz i zaznacz światła</button>
            <button class="btn-routing" id="btn-wyczysc-trase" onclick="wyczyscTrase()">🗑️ Wyczyść trasę</button>
            <button class="btn-routing" id="btn-zamknij-routing" onclick="zamknijModalRouting()">Zamknij</button>
        </div>
    </div>

    <div id="panel">
        <h2 id="nazwa-skrzyzowania">Skrzyżowanie</h2>
        <div id="swiatlo">⚫</div>
        <div id="odliczanie">--</div>
        <div id="opis">Ładowanie...</div>
        <div id="dokladnosc"></div>
        <div id="przyciski-korekty">
            <button class="btn-korekta" id="btn-korekta-czerwone" onclick="koryguj('czerwone')">🔴 Właśnie zmieniło się na CZERWONE</button>
            <button class="btn-korekta" id="btn-korekta-zielone" onclick="koryguj('zielone')">🟢 Właśnie zmieniło się na ZIELONE</button>
        </div>
        <button id="btn-mowa" onclick="wlaczMowe()">🔊 Włącz głos</button>
        <br>
        <span id="tryb-toggle" onclick="przełączTryb()">⚙️ Tryb pomiaru nowego skrzyżowania</span>
        <div id="przyciski-pomiaru">
            <div id="log-pomiarow"></div>
            <button class="btn-pomiar" id="btn-czerwone" onclick="zapiszZmiane('czerwone')">🔴 Zapaliło się CZERWONE</button>
            <button class="btn-pomiar" id="btn-zielone" onclick="zapiszZmiane('zielone')">🟢 Zapaliło się ZIELONE</button>
            <button class="btn-pomiar" id="btn-zapisz" onclick="zapiszDane()">💾 Zapisz dane</button>
        </div>
        <br>
        <button id="zamknij" onclick="zamknijPanel()">Zamknij</button>
    </div>

    <script>
        const mapa = L.map('mapa').setView([50.01420215172329, 19.999269960360717], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(mapa);

        let aktualneSkrzyzowanie = null;
        let pomiary = [];
        let interwał = null;
        let mowaWlaczona = false;
        let ostatnioMowiono = null;
        let trybPomiaru = false;
        let trybZaznaczania = false;
        let trybEdycji = false;
        let edytowanaNazwaTrasy = null;
        let warstwyMarkerow = {};
        let liniaTrasy = null;
        let licznikPosrednich = 0;

        const daneSkrzyzowan = {
            'wielicka_teligi': {
                startZielone: { h: 13, m: 50, s: 16 },
                czasZielone: 15,
                czasCzerwone: 96,
                ostatniaKorekta: null,
                ostatniKolorKorekty: null
            }
        };

        // Routing
        function otworzModalRouting() {
            document.getElementById('modal-routing').classList.add('aktywny');
        }

        function zamknijModalRouting() {
            document.getElementById('modal-routing').classList.remove('aktywny');
        }

        function dodajPunktPosredni() {
            licznikPosrednich++;
            const div = document.createElement('div');
            div.id = 'posredni-' + licznikPosrednich;
            div.style.display = 'flex';
            div.style.gap = '5px';
            div.style.margin = '5px 0';
            div.innerHTML = `
                <input class="input-adres" style="flex:1" placeholder="📌 Punkt pośredni ${licznikPosrednich}" id="adres-posredni-${licznikPosrednich}"/>
                <button onclick="document.getElementById('posredni-${licznikPosrednich}').remove()" style="padding:5px 10px;background:#e74c3c;color:white;border:none;border-radius:10px;cursor:pointer;">✕</button>
            `;
            document.getElementById('punkty-posrednie').appendChild(div);
        }

        async function geokoduj(adres) {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adres)}&limit=1&countrycodes=pl`;
            const resp = await fetch(url, { headers: { 'Accept-Language': 'pl' } });
            const dane = await resp.json();
            if (dane.length === 0) throw new Error('Nie znaleziono: ' + adres);
            return { lat: parseFloat(dane[0].lat), lng: parseFloat(dane[0].lon) };
        }

        function dystans(lat1, lng1, lat2, lng2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function dystansDoLinii(pLat, pLng, aLat, aLng, bLat, bLng) {
            const dx = bLng - aLng;
            const dy = bLat - aLat;
            if (dx === 0 && dy === 0) return dystans(pLat, pLng, aLat, aLng);
            const t = Math.max(0, Math.min(1, ((pLng - aLng) * dx + (pLat - aLat) * dy) / (dx * dx + dy * dy)));
            return dystans(pLat, pLng, aLat + t * dy, aLng + t * dx);
        }

        function czyNaTransie(lat, lng, wspolrzedne, promien) {
            for (let i = 0; i < wspolrzedne.length - 1; i++) {
                const d = dystansDoLinii(lat, lng,
                    wspolrzedne[i][0], wspolrzedne[i][1],
                    wspolrzedne[i+1][0], wspolrzedne[i+1][1]);
                if (d <= promien) return true;
            }
            return false;
        }

        async function wyznaczTrase() {
            const status = document.getElementById('status-routing');
            status.innerText = '⏳ Szukam adresów...';

            try {
                const adresStart = document.getElementById('adres-start').value;
                const adresKoniec = document.getElementById('adres-koniec').value;

                if (!adresStart || !adresKoniec) {
                    status.innerText = '❌ Podaj punkt startowy i końcowy!';
                    return;
                }

                // Geokodowanie
                const punktStart = await geokoduj(adresStart);
                const punktKoniec = await geokoduj(adresKoniec);

                // Punkty pośrednie
                const posrednie = [];
                for (let i = 1; i <= licznikPosrednich; i++) {
                    const el = document.getElementById('adres-posredni-' + i);
                    if (el && el.value) {
                        const p = await geokoduj(el.value);
                        posrednie.push(p);
                    }
                }

                status.innerText = '⏳ Wyznaczam trasę...';

                // Buduj URL OSRM
                let wspolrzedneURL = `${punktStart.lng},${punktStart.lat}`;
                posrednie.forEach(p => { wspolrzedneURL += `;${p.lng},${p.lat}`; });
                wspolrzedneURL += `;${punktKoniec.lng},${punktKoniec.lat}`;

                const osrmURL = `https://router.project-osrm.org/route/v1/driving/${wspolrzedneURL}?overview=full&geometries=geojson`;
                const resp = await fetch(osrmURL);
                const dane = await resp.json();

                if (dane.code !== 'Ok') {
                    status.innerText = '❌ Nie udało się wyznaczyć trasy';
                    return;
                }

                // Rysuj trasę na mapie
                if (liniaTrasy) mapa.removeLayer(liniaTrasy);
                const wspolrzedne = dane.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                liniaTrasy = L.polyline(wspolrzedne, {
                    color: '#8e44ad',
                    weight: 5,
                    opacity: 0.8
                }).addTo(mapa);
                mapa.fitBounds(liniaTrasy.getBounds());

                // Zaznacz sygnalizatory na trasie
                status.innerText = '⏳ Zaznaczam sygnalizatory...';
                let liczba = 0;
                const promien = 35; // metry

                Object.keys(warstwyMarkerow).forEach(id => {
                    const marker = warstwyMarkerow[id];
                    const latLng = marker.layer.getLatLng();
                    const naT = czyNaTransie(latLng.lat, latLng.lng, wspolrzedne, promien);

                    if (naT) {
                        marker.naTransie = true;
                        marker.layer.setStyle({ fillColor: "#00cc00" });
                        liczba++;
                    } else {
                        marker.naTransie = false;
                        const czyReczny = !id.startsWith('osm_');
                        marker.layer.setStyle({ fillColor: czyReczny ? "#ff0000" : "#ffcc00" });
                    }
                });

                const czas = Math.round(dane.routes[0].duration / 60);
                const dystansKm = (dane.routes[0].distance / 1000).toFixed(1);
                status.innerText = `✅ Trasa: ${dystansKm} km, ~${czas} min | Sygnalizatorów: ${liczba}`;

            } catch(e) {
                status.innerText = '❌ Błąd: ' + e.message;
            }
        }

        function wyczyscTrase() {
            if (liniaTrasy) {
                mapa.removeLayer(liniaTrasy);
                liniaTrasy = null;
            }
            Object.keys(warstwyMarkerow).forEach(id => {
                warstwyMarkerow[id].naTransie = false;
                const czyReczny = !id.startsWith('osm_');
                warstwyMarkerow[id].layer.setStyle({ fillColor: czyReczny ? "#ff0000" : "#ffcc00" });
            });
            document.getElementById('status-routing').innerText = '';
            document.getElementById('adres-start').value = '';
            document.getElementById('adres-koniec').value = '';
            document.getElementById('punkty-posrednie').innerHTML = '';
            licznikPosrednich = 0;
        }

        // System tras
        function wczytajTrasy() {
            const dane = localStorage.getItem('trasy');
            return dane ? JSON.parse(dane) : {};
        }

        function zapiszTrasy(trasy) {
            localStorage.setItem('trasy', JSON.stringify(trasy));
        }

        function eksportujTrasy() {
            const trasy = wczytajTrasy();
            if (Object.keys(trasy).length === 0) {
                alert('Brak tras do eksportu!');
                return;
            }
            const kod = btoa(JSON.stringify(trasy));
            prompt('Skopiuj ten kod i wklej na innym urządzeniu:', kod);
        }

        function importujTrasy() {
            const kod = prompt('Wklej kod trasy:');
            if (!kod) return;
            try {
                const trasy = JSON.parse(atob(kod));
                const istniejace = wczytajTrasy();
                const polaczone = Object.assign(istniejace, trasy);
                zapiszTrasy(polaczone);
                alert('✅ Trasy zaimportowane pomyślnie!');
                otworzModalTras();
            } catch(e) {
                alert('❌ Błędny kod — spróbuj ponownie');
            }
        }

        function pobierzZaznaczone() {
            return Object.keys(warstwyMarkerow).filter(id => warstwyMarkerow[id].naTransie);
        }

        function zapiszTrase() {
            const punkty = pobierzZaznaczone();
            if (punkty.length === 0) {
                alert('Nie zaznaczono żadnych sygnalizatorów!');
                return;
            }
            let nazwa;
            if (trybEdycji && edytowanaNazwaTrasy) {
                nazwa = edytowanaNazwaTrasy;
            } else {
                nazwa = prompt('Podaj nazwę trasy:', 'Trasa nr ' + (Object.keys(wczytajTrasy()).length + 1));
                if (!nazwa) return;
            }
            const trasy = wczytajTrasy();
            trasy[nazwa] = punkty;
            zapiszTrasy(trasy);
            alert('✅ Trasa "' + nazwa + '" zapisana! (' + punkty.length + ' sygnalizatorów)');
            wyjdzZTrybuZaznaczania();
        }

        function wyjdzZTrybuZaznaczania() {
            trybZaznaczania = false;
            trybEdycji = false;
            edytowanaNazwaTrasy = null;
            document.getElementById('btn-zapisz-trase').style.display = 'none';
            document.getElementById('btn-zapisz-trase').innerText = '💾 Zapisz trasę';
            document.getElementById('btn-trasa').innerText = '🗺️ Zaznacz trasę';
            document.getElementById('btn-trasa').style.background = '#444';
            document.getElementById('btn-trasa').style.color = 'white';
            document.getElementById('info-edycja').style.display = 'none';
        }

        function otworzModalTras() {
            const trasy = wczytajTrasy();
            const lista = document.getElementById('lista-tras');
            lista.innerHTML = '';
            if (Object.keys(trasy).length === 0) {
                lista.innerHTML = '<p style="color:#aaa">Brak zapisanych tras</p>';
            } else {
                Object.keys(trasy).forEach(nazwa => {
                    const div = document.createElement('div');
                    div.className = 'trasa-row';
                    const btn = document.createElement('button');
                    btn.className = 'btn-trasa-lista';
                    btn.innerText = '🗺️ ' + nazwa + ' (' + trasy[nazwa].length + ' pkt)';
                    btn.onclick = () => { zaladujTrase(nazwa); zamknijModal(); };
                    const btnEdytuj = document.createElement('button');
                    btnEdytuj.className = 'btn-trasa-edytuj';
                    btnEdytuj.innerText = '✏️';
                    btnEdytuj.onclick = () => { edytujTrase(nazwa); zamknijModal(); };
                    const btnUsun = document.createElement('button');
                    btnUsun.className = 'btn-trasa-usun';
                    btnUsun.innerText = '🗑️';
                    btnUsun.onclick = () => {
                        if (confirm('Usunąć trasę "' + nazwa + '"?')) {
                            const t = wczytajTrasy();
                            delete t[nazwa];
                            zapiszTrasy(t);
                            otworzModalTras();
                        }
                    };
                    div.appendChild(btn);
                    div.appendChild(btnEdytuj);
                    div.appendChild(btnUsun);
                    lista.appendChild(div);
                });
            }
            document.getElementById('modal-trasy').classList.add('aktywny');
        }

        function zamknijModal() {
            document.getElementById('modal-trasy').classList.remove('aktywny');
        }

        function nowaTrasa() {
            zamknijModal();
            Object.keys(warstwyMarkerow).forEach(id => {
                warstwyMarkerow[id].naTransie = false;
                const czyReczny = !id.startsWith('osm_');
                warstwyMarkerow[id].layer.setStyle({ fillColor: czyReczny ? "#ff0000" : "#ffcc00" });
            });
            trybZaznaczania = true;
            trybEdycji = false;
            edytowanaNazwaTrasy = null;
            document.getElementById('btn-trasa').innerText = '✅ Zaznaczanie WŁ';
            document.getElementById('btn-trasa').style.background = '#00d4ff';
            document.getElementById('btn-trasa').style.color = '#1a1a2e';
            document.getElementById('btn-zapisz-trase').style.display = 'inline-block';
            document.getElementById('info-edycja').style.display = 'none';
        }

        function edytujTrase(nazwa) {
            zaladujTrase(nazwa);
            trybZaznaczania = true;
            trybEdycji = true;
            edytowanaNazwaTrasy = nazwa;
            document.getElementById('btn-trasa').innerText = '✏️ Edycja: ' + nazwa;
            document.getElementById('btn-trasa').style.background = '#f39c12';
            document.getElementById('btn-trasa').style.color = '#1a1a2e';
            document.getElementById('btn-zapisz-trase').innerText = '💾 Zapisz zmiany';
            document.getElementById('btn-zapisz-trase').style.display = 'inline-block';
            document.getElementById('info-edycja').style.display = 'block';
        }

        function zaladujTrase(nazwa) {
            const trasy = wczytajTrasy();
            const punkty = trasy[nazwa];
            Object.keys(warstwyMarkerow).forEach(id => {
                warstwyMarkerow[id].naTransie = false;
                const czyReczny = !id.startsWith('osm_');
                if (warstwyMarkerow[id].layer) {
                    warstwyMarkerow[id].layer.setStyle({ fillColor: czyReczny ? "#ff0000" : "#ffcc00" });
                }
            });
            punkty.forEach(id => {
                if (warstwyMarkerow[id]) {
                    warstwyMarkerow[id].naTransie = true;
                    warstwyMarkerow[id].layer.setStyle({ fillColor: "#00cc00" });
                }
            });
        }

        function przełączTrybZaznaczania() {
            if (trybZaznaczania) {
                wyjdzZTrybuZaznaczania();
                Object.keys(warstwyMarkerow).forEach(id => {
                    warstwyMarkerow[id].naTransie = false;
                    const czyReczny = !id.startsWith('osm_');
                    warstwyMarkerow[id].layer.setStyle({ fillColor: czyReczny ? "#ff0000" : "#ffcc00" });
                });
            } else {
                nowaTrasa();
            }
        }

        function koryguj(kolor) {
            const dane = daneSkrzyzowan[aktualneSkrzyzowanie.id];
            if (!dane) return;
            dane.ostatniaKorekta = Date.now();
            dane.ostatniKolorKorekty = kolor;
            ostatnioMowiono = null;
            const godzinaStr = new Date().toLocaleTimeString('pl-PL');
            document.getElementById('dokladnosc').innerText = '✅ Zsynchronizowano o ' + godzinaStr;
            mow(kolor === 'zielone' ? 'Zsynchronizowano. Zielone.' : 'Zsynchronizowano. Czerwone.');
        }

        function obliczStan(dane) {
            const teraz = Date.now();
            const cykl = (dane.czasZielone + dane.czasCzerwone) * 1000;
            if (dane.ostatniaKorekta !== null) {
                const uplynelo = teraz - dane.ostatniaKorekta;
                let pozycja;
                if (dane.ostatniKolorKorekty === 'zielone') {
                    pozycja = uplynelo % cykl;
                } else {
                    pozycja = (dane.czasZielone * 1000 + uplynelo) % cykl;
                }
                const pozycjaSek = Math.floor(pozycja / 1000);
                if (pozycjaSek < dane.czasZielone) {
                    return { kolor: 'zielone', pozostalo: dane.czasZielone - pozycjaSek };
                } else {
                    return { kolor: 'czerwone', pozostalo: dane.czasZielone + dane.czasCzerwone - pozycjaSek };
                }
            }
            const start = new Date();
            start.setHours(dane.startZielone.h);
            start.setMinutes(dane.startZielone.m);
            start.setSeconds(dane.startZielone.s);
            start.setMilliseconds(0);
            if (start > new Date()) start.setDate(start.getDate() - 1);
            const sekundy = Math.floor((Date.now() - start.getTime()) / 1000);
            const pozycja = sekundy % (dane.czasZielone + dane.czasCzerwone);
            if (pozycja < dane.czasZielone) {
                return { kolor: 'zielone', pozostalo: dane.czasZielone - pozycja };
            } else {
                return { kolor: 'czerwone', pozostalo: dane.czasZielone + dane.czasCzerwone - pozycja };
            }
        }

        function wlaczMowe() {
            mowaWlaczona = !mowaWlaczona;
            const btn = document.getElementById('btn-mowa');
            if (mowaWlaczona) {
                btn.innerText = '🔊 Głos: WŁ';
                btn.style.background = '#27ae60';
                mow('Komunikaty głosowe włączone');
            } else {
                btn.innerText = '🔇 Głos: WYŁ';
                btn.style.background = '#7f8c8d';
                ostatnioMowiono = null;
            }
        }

        function mow(tekst) {
            if (!mowaWlaczona) return;
            if (ostatnioMowiono === tekst) return;
            ostatnioMowiono = tekst;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(tekst);
            msg.lang = 'pl-PL';
            msg.volume = 1;
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        function przełączTryb() {
            trybPomiaru = !trybPomiaru;
            document.getElementById('przyciski-pomiaru').style.display = trybPomiaru ? 'block' : 'none';
            document.getElementById('tryb-toggle').innerText = trybPomiaru
                ? '⚙️ Ukryj tryb pomiaru'
                : '⚙️ Tryb pomiaru nowego skrzyżowania';
        }

        function otworzPanel(skrzyzowanie) {
            aktualneSkrzyzowanie = skrzyzowanie;
            pomiary = [];
            ostatnioMowiono = null;
            trybPomiaru = false;
            document.getElementById('panel').style.display = 'block';
            document.getElementById('nazwa-skrzyzowania').innerText = skrzyzowanie.nazwa;
            document.getElementById('log-pomiarow').innerHTML = '';
            document.getElementById('btn-zapisz').style.display = 'none';
            document.getElementById('przyciski-pomiaru').style.display = 'none';
            document.getElementById('tryb-toggle').innerText = '⚙️ Tryb pomiaru nowego skrzyżowania';
            document.getElementById('btn-mowa').innerText = '🔊 Włącz głos';
            document.getElementById('btn-mowa').style.background = '#9b59b6';
            mowaWlaczona = false;
            if (interwał) clearInterval(interwał);
            const dane = daneSkrzyzowan[skrzyzowanie.id];
            if (dane) {
                document.getElementById('przyciski-korekty').style.display = 'flex';
                document.getElementById('dokladnosc').innerText = '⚠️ Kliknij gdy zmieni się światło aby zsynchronizować';
                function aktualizuj() {
                    const stan = obliczStan(dane);
                    document.getElementById('swiatlo').innerText = stan.kolor === 'zielone' ? '🟢' : '🔴';
                    document.getElementById('odliczanie').innerText = stan.pozostalo + ' sek';
                    document.getElementById('opis').innerText = stan.kolor === 'zielone'
                        ? '🚗 Jedź! Zielone jeszcze przez:'
                        : '✋ Poczekaj. Czerwone jeszcze przez:';
                    if (stan.kolor === 'czerwone' && stan.pozostalo === 10) mow('Za 10 sekund zielone');
                    if (stan.kolor === 'czerwone' && stan.pozostalo === 5) mow('Za 5 sekund zmiana światła');
                    if (stan.kolor === 'czerwone' && stan.pozostalo === 3) mow('Za 3 sekundy zielone');
                    if (stan.kolor === 'zielone' && stan.pozostalo === 3) mow('Uwaga, za 3 sekundy czerwone');
                }
                aktualizuj();
                interwał = setInterval(aktualizuj, 1000);
            } else {
                document.getElementById('przyciski-korekty').style.display = 'none';
                document.getElementById('swiatlo').innerText = '⚫';
                document.getElementById('odliczanie').innerText = 'Zmierz światła';
                document.getElementById('opis').innerText = 'Kliknij gdy zmienia się światło';
                document.getElementById('dokladnosc').innerText = '📍 Stań przy skrzyżowaniu i zacznij mierzyć';
                document.getElementById('przyciski-pomiaru').style.display = 'block';
                trybPomiaru = true;
            }
        }

        function zamknijPanel() {
            document.getElementById('panel').style.display = 'none';
            if (interwał) clearInterval(interwał);
            window.speechSynthesis.cancel();
            mowaWlaczona = false;
        }

        function zapiszZmiane(kolor) {
            const teraz = Date.now();
            pomiary.push({ kolor, czas: teraz });
            const godzinaStr = new Date(teraz).toLocaleTimeString('pl-PL');
            const ikona = kolor === 'czerwone' ? '🔴' : '🟢';
            document.getElementById('log-pomiarow').innerHTML += ikona + ' ' + godzinaStr + '<br>';
            document.getElementById('swiatlo').innerText = kolor === 'czerwone' ? '🔴' : '🟢';
            if (pomiary.length >= 2) {
                document.getElementById('btn-zapisz').style.display = 'inline-block';
                const roznica = Math.round((pomiary[pomiary.length-1].czas - pomiary[pomiary.length-2].czas) / 1000);
                document.getElementById('odliczanie').innerText = pomiary[pomiary.length-2].kolor + ' trwało: ' + roznica + 's';
            }
        }

        function zapiszDane() {
            if (pomiary.length < 2) return;
            let sumaZ = 0, liczbZ = 0, sumaC = 0, liczbC = 0;
            for (let i = 1; i < pomiary.length; i++) {
                const roznica = (pomiary[i].czas - pomiary[i-1].czas) / 1000;
                if (pomiary[i].kolor === 'zielone') { sumaC += roznica; liczbC++; }
                else { sumaZ += roznica; liczbZ++; }
            }
            const pierwszeZielone = pomiary.find(p => p.kolor === 'zielone');
            const d = new Date(pierwszeZielone.czas);
            daneSkrzyzowan[aktualneSkrzyzowanie.id] = {
                startZielone: { h: d.getHours(), m: d.getMinutes(), s: d.getSeconds() },
                czasZielone: liczbZ > 0 ? Math.round(sumaZ / liczbZ) : 15,
                czasCzerwone: liczbC > 0 ? Math.round(sumaC / liczbC) : 96,
                ostatniaKorekta: null,
                ostatniKolorKorekty: null
            };
            alert('✅ Dane zapisane!');
            otworzPanel(aktualneSkrzyzowanie);
        }

        // GPS
        let markerGPS = null;
        mapa.locate({ watch: true, enableHighAccuracy: true });
        mapa.on('locationfound', function(e) {
            if (markerGPS) {
                markerGPS.setLatLng(e.latlng);
            } else {
                markerGPS = L.circleMarker(e.latlng, {
                    radius: 10, fillColor: "#00d4ff", color: "#fff", weight: 3, fillOpacity: 1
                }).addTo(mapa);
                mapa.setView(e.latlng, 16);
            }
        });

        function dodajMarker(lat, lng, id, nazwa) {
            const layer = L.circleMarker([lat, lng], {
                radius: 10, fillColor: "#ff0000", color: "#fff", weight: 2, fillOpacity: 1
            }).addTo(mapa);
            layer.on('click', function() {
                if (trybZaznaczania) {
                    warstwyMarkerow[id].naTransie = !warstwyMarkerow[id].naTransie;
                    layer.setStyle({ fillColor: warstwyMarkerow[id].naTransie ? "#00cc00" : "#ff0000" });
                } else {
                    otworzPanel({ id, nazwa });
                }
            });
            warstwyMarkerow[id] = { layer, naTransie: false };
        }

        dodajMarker(50.03667663430466, 19.94068768665933, 'mateczny_kalwaryjska', 'Mateczny / Kalwaryjska');
        dodajMarker(50.017316906572326, 19.991255815131844, 'wielicka_facimiech', 'Wielicka / Facimiech');
        dodajMarker(50.01420215172329, 19.999269960360717, 'wielicka_teligi', 'Wielicka / Teligi');

        fetch('sygnalizatory.geojson')
            .then(r => r.json())
            .then(data => {
                L.geoJSON(data, {
                    pointToLayer: (f, latlng) => L.circleMarker(latlng, {
                        radius: 5, fillColor: "#ffcc00", color: "#fff", weight: 1, fillOpacity: 0.8
                    }),
                    onEachFeature: (f, layer) => {
                        const id = 'osm_' + f.id;
                        const nazwa = f.properties.name || 'Sygnalizator';
                        warstwyMarkerow[id] = { layer, naTransie: false };
                        layer.on('click', () => {
                            if (trybZaznaczania) {
                                warstwyMarkerow[id].naTransie = !warstwyMarkerow[id].naTransie;
                                layer.setStyle({ fillColor: warstwyMarkerow[id].naTransie ? "#00cc00" : "#ffcc00" });
                            } else {
                                otworzPanel({ id, nazwa });
                            }
                        });
                    }
                }).addTo(mapa);
            });
    </script>
</body>
